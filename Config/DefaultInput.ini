[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; The viewport takes no mouse capture of its own before the player clicks (#171 item 6): the engine defaults capture the pointer when the window
; first activates, which on Linux hides the cursor in SDL relative mode and spends the first click. The controller captures only while a button is down.
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
