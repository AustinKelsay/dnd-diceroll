[/Script/Engine.RendererSettings]
; Custom depth with stencil (3): figures write it (stencil 1 party, 2 enemy) so M_FigureSilhouette can draw them through scenery.
r.CustomDepth=3

[SystemSettings]
; Anisotropic 8 for themed textures (#143): the themed textures use TF_DEFAULT, and the TEXTUREGROUP_World override in
; DefaultDeviceProfiles.ini makes that group aniso + linear mips (the engine's own World group has point mips).
; Cascaded shadow maps, not virtual shadow maps.
r.MaxAnisotropy=8
r.Shadow.Virtual.Enable=0
