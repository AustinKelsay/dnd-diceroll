; Device profile overrides (#143).
; The engine's TEXTUREGROUP_World is MinMagFilter=aniso with MipFilter=point, which Unreal turns into an anisotropic-POINT
; sampler (mips are not blended). Gate 1 chose trilinear + anisotropic 8, so mips must blend: aniso + linear is the
; anisotropic-linear sampler. The themed textures (T_*) use TF_DEFAULT in TEXTUREGROUP_World and r.MaxAnisotropy=8.
; The entry is replaced rather than appended: a duplicate group entry would shift every later group.
[GlobalDefaults DeviceProfile]
-TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
